name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify source
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          ruff check src/python_qt6 tests tools
          python -m compileall -q src/python_qt6 tests tools

      - name: Build Windows artifact
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-pyqt6.ps1

      - name: Verify release metadata and contents
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath dist_pyqt6/SoundboardQt6.exe
          if ($exe.VersionInfo.ProductName -ne "Soundboard Studio") {
            throw "Unexpected product name: $($exe.VersionInfo.ProductName)"
          }
          if ($exe.VersionInfo.ProductVersion -ne (Get-Content VERSION -Raw).Trim()) {
            throw "The executable and VERSION file do not match."
          }
          $bundledDriverFiles = @(Get-ChildItem dist_pyqt6/driver -Recurse -File -ErrorAction SilentlyContinue)
          if ($bundledDriverFiles.Count -gt 0) {
            throw "The proprietary VB-CABLE package must not be in the public CI artifact."
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SoundboardQt6.exe" | Set-Content dist_pyqt6/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soundboard-studio-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist_pyqt6/SoundboardQt6.exe
            dist_pyqt6/SHA256SUMS.txt
            dist_pyqt6/LICENSE
            dist_pyqt6/README.md
            dist_pyqt6/CHANGELOG.md
            dist_pyqt6/PRIVACY.md
            dist_pyqt6/SECURITY.md
            dist_pyqt6/THIRD_PARTY_NOTICES.md
            dist_pyqt6/UNINSTALL.md
            dist_pyqt6/licenses/**
