<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Soundboard Remote</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="remote-shell">
    <header class="remote-topbar">
      <div class="remote-brand">
        <img class="brand-mark" src="/brand-logo.png" alt="" aria-hidden="true">
        <span class="brand-copy">
          <strong>Soundboard Remote</strong>
          <small>Tap once to send clean audio.</small>
        </span>
      </div>
      <div class="remote-actions">
        <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
          <svg class="fullscreen-icon enter-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 10V5h5M14 5h5v5M19 14v5h-5M10 19H5v-5"></path>
          </svg>
          <svg class="fullscreen-icon exit-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5v4H5M15 5v4h4M19 15h-4v4M5 15h4v4"></path>
          </svg>
        </button>
        <span id="connectionStatus" class="status-pill waiting" role="status" aria-live="polite" aria-atomic="true">
          <span class="status-dot"></span>
          <span id="connectionText">Connecting</span>
        </span>
      </div>
    </header>

    <section class="remote-control-bar" aria-label="Playback controls">
      <span class="control-copy">
        <strong>Mode</strong>
        <small id="modeHint">Stack sounds together</small>
      </span>
      <div class="mode-switch" role="group" aria-label="Playback mode">
        <button id="layerModeButton" class="mode-button is-active" type="button" data-mode="layer" aria-pressed="true">
          Stack
        </button>
        <button id="replaceModeButton" class="mode-button" type="button" data-mode="replace" aria-pressed="false">
          Solo
        </button>
      </div>
      <button id="stopAllButton" class="stop-button" type="button">
        Stop all
      </button>
    </section>

    <section id="remoteGrid" class="pad-grid" aria-label="Soundboard pads"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
